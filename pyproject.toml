[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-retention-lab"
version = "0.1.0"
description = "Reproducible SaaS cohort retention analytics"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]
[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
test = ["pytest>=7"]
[project.scripts]
cohortlab = "cohortlab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
